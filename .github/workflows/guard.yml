name: guard

# 이 저장소는 jeju-inst/ji-gw-ai 의 share-publish 워크플로가 자동 생성한다. 직접 수정은 다음
# 동기화 때 덮어써지므로 받지 않는다: PR 은 항상 실패, main 커밋은 동기화 표식이 있어야 통과.
# (밀어넣기 자체는 저장소 규칙(ruleset)이 deploy key 만 허용해 막는다 — 이 검사는 두 번째 겹.)

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  guard:
    runs-on: ubuntu-latest
    steps:
      - name: PR 은 받지 않음
        if: github.event_name == 'pull_request'
        run: |
          echo "::error::자동 생성 저장소입니다. 수정은 jeju-inst/ji-gw-ai 의 share/ 에 PR 로 올리세요."
          exit 1
      - name: 동기화 커밋인지 확인
        if: github.event_name == 'push'
        env:
          MSG: ${{ github.event.head_commit.message }}
        run: |
          if printf '%s' "$MSG" | grep -qE '^Source: jeju-inst/ji-gw-ai@[0-9a-f]{40}$'; then
            echo "동기화 커밋 확인"
          else
            echo "::error::동기화 표식(Source: jeju-inst/ji-gw-ai@<sha>)이 없는 커밋 — 직접 수정은 ji-gw-ai 로."
            exit 1
          fi
